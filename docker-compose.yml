# Self-host: `docker compose up -d`, then open http://localhost:3000
# Copy .env.example to .env first and set OWNER_PASSWORD and APP_SECRET.
services:
  game:
    build: .
    ports:
      - "3000:3000"
    env_file: .env
    environment:
      NODE_ENV: production
      DATABASE_PATH: /data/digital-workforce.db
      BACKUP_DIR: /data/backups
    volumes:
      - game-data:/data
    restart: unless-stopped
volumes:
  game-data:
