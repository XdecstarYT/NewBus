# One-click hosting on Render (https://render.com): New > Blueprint > pick this repo.
# The persistent disk keeps everyone's progress; Render disks need a paid instance (Starter).
services:
  - type: web
    name: digital-workforce
    runtime: docker
    plan: starter
    healthCheckPath: /api/health
    disk:
      name: game-data
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: COOKIE_SECURE
        value: "true"
      - key: APP_SECRET
        generateValue: true
      - key: OWNER_ACCOUNT_NUMBER
        value: "01"
      - key: OWNER_PASSWORD
        sync: false # you type your own strong password in the Render dashboard
      - key: SEED_DEMO
        value: "false"
