# One-click hosting on Render (https://render.com): New > Blueprint > pick this repo.
# The persistent disk keeps everyone's progress; Render disks need a paid instance (Starter).
services:
  - type: web
    name: digital-workforce
    runtime: docker
    plan: starter
    healthCheckPath: /api/health
    disk:
      name: game-data
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: COOKIE_SECURE
        value: "true"
      - key: APP_SECRET
        generateValue: true
      - key: OWNER_ACCOUNT_NUMBER
        value: "01"
      - key: OWNER_PASSWORD
        value: Diddy # first login is 01 / Diddy; the game then makes you pick a new password
      - key: OWNER_RESET_PASSWORD
        value: "false" # set to "true" for one deploy if you ever get locked out
      - key: SEED_DEMO
        value: "false"
