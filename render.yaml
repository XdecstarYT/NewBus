# One-click hosting on Render (https://render.com): New > Blueprint > pick this repo.
# The game's data lives in Supabase (DATABASE_URL), so the server needs no disk and the
# free plan works. On a free instance Render sleeps the server after ~15 minutes without
# visitors; on wake-up it reloads the game from Supabase automatically.
services:
  - type: web
    name: digital-workforce
    runtime: docker
    plan: free
    region: virginia # same AWS region as the Supabase project (us-east-1) = fastest sync
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false # paste your Supabase "Session pooler" connection string (see README)
      - key: APP_SECRET
        generateValue: true
      - key: OWNER_ACCOUNT_NUMBER
        value: "01"
      - key: OWNER_PASSWORD
        value: Diddy # first login is 01 / Diddy; the game then makes you pick a new password
      - key: OWNER_RESET_PASSWORD
        value: "false" # set to "true" for one deploy if you ever get locked out
      - key: SEED_DEMO
        value: "false"
      # Hosting the pages on Netlify? Set PUBLIC_URL to your Netlify address (e.g. https://my-game.netlify.app)
      # and TRUST_PROXY to "2" (Netlify + Render). Leave both alone when players use the Render address.
      - key: PUBLIC_URL
        sync: false
      - key: TRUST_PROXY
        value: "1"
